<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Gastos Personales</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Gestor de Gastos Personales</h1>

    <!-- Formulario para registrar o editar un gasto -->
    <form id="form-gasto">
      <input type="hidden" id="gasto-id" />

      <label for="descripcion">Descripción</label>
      <input type="text" id="descripcion" required />

      <label for="monto">Monto</label>
      <input type="number" id="monto" step="0.01" required />

      <label for="categoria_id">Categoría</label>
      <select id="categoria_id" required>
        <option value="">Seleccionar...</option>
        <option value="1">Vivienda</option>
        <option value="2">Alimento</option>
        <option value="3">Transporte</option>
        <option value="4">Salud</option>
        <option value="5">Entretenimiento</option>
        <option value="6">Otros</option>
      </select>

      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" required />

      <button type="submit">Guardar gasto</button>
    </form>

    <!-- Este valor se actualiza desde app.js según los gastos visibles. -->
    <h2>Total gastado: $<span id="total-gastado">0</span></h2>

    <!-- app.js inserta aquí el total acumulado de cada categoría. -->
    <h3>Total por categoría:</h3>
    <ul id="lista-totales-categoria"></ul>

    <!-- Al cambiar la categoría, app.js filtra los gastos mostrados en la tabla. -->
    <label for="filtro-categoria">Filtrar por categoría</label>
    <select id="filtro-categoria">
      <option value="todas">Todas</option>
      <option value="1">Vivienda</option>
      <option value="2">Alimento</option>
      <option value="3">Transporte</option>
      <option value="4">Salud</option>
      <option value="5">Entretenimiento</option>
      <option value="6">Otros</option>
    </select>

    <!-- Estos controles permiten filtrar los gastos por un rango de fechas. -->
    <label for="filtro-desde">Desde</label>
    <input type="date" id="filtro-desde" />

    <label for="filtro-hasta">Hasta</label>
    <input type="date" id="filtro-hasta" />

    <button id="btn-filtrar-fecha">Filtrar</button>

    <!-- Tabla donde se listan los gastos ya registrados -->
    <table id="tabla-gastos">
      <thead>
        <tr>
          <th>Descripción</th>
          <th>Monto</th>
          <th>Categoría</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla-gastos">
        <!-- Acá se van a insertar las filas con JS, dinámicamente -->
      </tbody>
    </table>

    <script src="app.js"></script>
  </body>
</html>
